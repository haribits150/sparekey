<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpareKey — Lend your empty home to trusted friends</title>
<meta name="description" content="Post the dates you're away. Only people you trust can request to stay. No strangers, no payments.">
<meta name="theme-color" content="#1f6f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SpareKey">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6f4a'/%3E%3Ccircle cx='24' cy='32' r='10' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M32 32h20v6h-8v6h-6v-6z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="26" height="26"><rect width="64" height="64" rx="14" fill="#1f6f4a"/><circle cx="24" cy="32" r="10" fill="none" stroke="white" stroke-width="5"/><path d="M32 32h20v6h-8v6h-6v-6z" fill="white"/></svg>
      </span>
      <span class="brand-name">SpareKey</span>
    </div>
    <label class="whoami">
      <span class="whoami-label">Viewing as</span>
      <select id="whoami" aria-label="Viewing as"></select>
    </label>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Primary">
    <a href="#/home" data-tab="home" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </a>
    <a href="#/requests" data-tab="requests" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Requests</span><b class="badge" id="reqBadge" hidden></b>
    </a>
    <a href="#/stays" data-tab="stays" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="14" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11.5 11.5 20 3m-2 4 3 3m-6 0 2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Stays</span>
    </a>
    <a href="#/score" data-tab="score" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m6 10V4m6 16v-7m4 7H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Saved</span>
    </a>
  </nav>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
